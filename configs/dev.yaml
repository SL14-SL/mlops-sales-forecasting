project:
  name: "Sales Forecasting MLOps"
  slug: "mlops-sales-forecasting"
  task_type: "forecasting"

notifications:
  enabled: true
  log_events: true
  fail_on_error: false
  webhook:
    enabled: false
    url: "${LIFECYCLE_WEBHOOK_URL:-}"
    timeout_seconds: 5.0
    
paths:
  data_root: "data"
  raw_data: "data/raw"
  validated_data: "data/validation"
  interim: "data/interim"
  processed: "data/processed"
  artifacts: "artifacts"
  models: "artifacts/models"
  features: "data/features"
  splits: "data/splits"
  versioning: "data/versioning"

data:
  target_column: Sales
  known_targets:
    - Sales
    - Customers
  time_column: Date
  id_columns:
    - Store
  primary_keys:
    - Store
    - Date

features:
  enabled_steps:
    - sort
    - temporal
    - lags
    - competition
    - promo
    - cast_categoricals
    - drop_technical
    - drop_configured
  lag_features:
    lags:
      - 1
      - 7
      - 14
      - 28
    rolling_windows:
      - 7
      - 14
      - 28
  technical_drop_columns:
    - CompetitionOpenSinceMonth
    - CompetitionOpenSinceYear
    - Promo2SinceWeek
    - Promo2SinceYear
    - PromoInterval
  drop_columns: []
  
services:
  prefect_api_url: "${PREFECT_API_URL:-http://localhost:4200/api}"

serving: 
  alias: "champion"

api:
  api_key: "${API_KEY:-dev-api-key-change-me}"
  
tracking:
  mlflow_tracking_uri: "${MLFLOW_TRACKING_URI:-http://localhost:5000}"
  experiment_name: "mlops-sales-forecasting-dev"
  model_name: "mlops-sales-forecasting-model-dev"
  promotion:

    metric_name: rmse
    direction: minimize
    minimum_improvement: 0.0

    allow_initial_champion: true