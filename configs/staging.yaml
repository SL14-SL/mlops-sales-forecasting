project:
  name: "Sales Forecasting MLOps"
  slug: "mlops-sales-forecasting"
  task_type: "forecasting"

notifications:
  enabled: true
  log_events: true
  fail_on_error: false
  webhook:
    enabled: false
    url: "${LIFECYCLE_WEBHOOK_URL:-}"
    timeout_seconds: 5.0
    
paths:
  data_root: "gs://${GCS_BUCKET_NAME:-replace-me}/data"
  raw_data: "gs://${GCS_BUCKET_NAME:-replace-me}/data/raw"
  validated_data: "gs://${GCS_BUCKET_NAME:-replace-me}/data/validation"
  interim: "gs://${GCS_BUCKET_NAME:-replace-me}/data/interim"
  processed: "gs://${GCS_BUCKET_NAME:-replace-me}/data/processed"
  artifacts: "gs://${GCS_BUCKET_NAME:-replace-me}/artifacts"
  models: "gs://${GCS_BUCKET_NAME:-replace-me}/models"
  features: "gs://${GCS_BUCKET_NAME:-replace-me}/data/features"
  splits: "gs://${GCS_BUCKET_NAME:-replace-me}/data/splits"
  versioning: "gs://${GCS_BUCKET_NAME:-replace-me}/data/versioning"

data:
  target_column: Sales
  known_targets:
    - Sales
    - Customers
  time_column: Date
  id_columns:
    - Store
  primary_keys:
    - Store
    - Date

features:
  enabled_steps:
    - sort
    - temporal
    - lags
    - competition
    - promo
    - cast_categoricals
    - drop_technical
    - drop_configured
  lag_features:
    lags:
      - 1
      - 7
      - 14
      - 28
    rolling_windows:
      - 7
      - 14
      - 28
  technical_drop_columns:
    - CompetitionOpenSinceMonth
    - CompetitionOpenSinceYear
    - Promo2SinceWeek
    - Promo2SinceYear
    - PromoInterval
  drop_columns: []
  
serving:
  alias: "champion"
  
services:
  prefect_api_url: "${PREFECT_API_URL}"

api:
  api_key: "${API_KEY}"

tracking:
  mlflow_tracking_uri: "${MLFLOW_TRACKING_URI}"
  experiment_name: "mlops-sales-forecasting-staging"
  model_name: "mlops-sales-forecasting-model-staging"
  promotion:

    metric_name: rmse
    direction: minimize
    minimum_improvement: 0.0

    allow_initial_champion: true