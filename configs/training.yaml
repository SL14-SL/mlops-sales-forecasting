project:
  name: mlops-sales-forecasting
  domain: forecasting
  schema_version: v1

model:
  type: xgboost
  params:
    # n_estimators: 300
    # max_depth: 8
    # learning_rate: 0.05
    # subsample: 0.8
    tree_method: hist
    enable_categorical: true
    n_estimators: 1200
    max_depth: 7
    learning_rate: 0.02951097123871115
    min_child_weight: 7
    subsample: 0.7591811958673289
    colsample_bytree: 0.8220753234069667
    reg_alpha: 0.026633895001357495
    reg_lambda: 8.719936821452245
    gamma: 0.22544860040323314
    objective: reg:squarederror
    early_stopping_rounds: 50

data:
  target_column: Sales
  known_targets: 
    - Sales
    - Customers
  time_column: Date
  id_columns:
    - Store
  primary_keys:
    - Store
    - Date

  feature_sources:
    train:
      path: train.parquet
    store:
      path: store.parquet
      merge_on:
        - Store
      how: left

training:
  validation_strategy: holdout
  test_size: 0.2
  target_transformation: log1p

  recency_weighting:
    enabled_for_drift: true
    promo_only: true
    promo_column: Promo
    last_30_days_weight: 10.0
    last_60_days_weight: 5.0
    last_120_days_weight: 2.0
    default_weight: 1.0

metrics:
  primary: rmse
  evaluate_on_original_scale: true

features:
  enabled_steps:
    - sort
    - temporal
    - lags
    - competition
    - promo
    - cast_categoricals
    - drop_technical
    - drop_configured

  lag_features:
    lags: [1,7,14,28]
    rolling_windows: [7,14,28]

  technical_drop_columns:
    - CompetitionOpenSinceMonth
    - CompetitionOpenSinceYear
    - Promo2SinceWeek
    - Promo2SinceYear

  drop_columns: []