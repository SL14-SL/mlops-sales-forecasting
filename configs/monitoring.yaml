feature_drift:
  enabled: true

  numeric_features:
    - Customers

  categorical_features:
    - Promo
    - Store

  min_samples: 50
  p_value_threshold: 0.01
  stat_threshold: 0.10

retraining:
  minimum_new_training_rows: 500
  cooldown_hours: 168
  scheduled_interval_hours: 168
  maximum_new_training_rows: 1000000

  drift:
    lookback_days: 14
    consecutive_windows: 2

  performance:
    consecutive_windows: 2
    rmse_limit: 1375.0
    mae_limit: 990.0
    absolute_bias_limit: 900.0
  

data_quality:
  enabled: true
  persist_history: false

  categorical_reference_features:
    - Promo
    - Store

serving:
  enabled: true
  metrics_endpoint_enabled: true
  summary_endpoint_enabled: true

  summary_window_seconds: 900

  track_paths:
    - /predict
    - /health

  ignored_paths:
    - /metrics
    - /monitoring/summary
    - /docs
    - /openapi.json
    - /redoc