[project]
name = "mlops-sales-forecasting"
version = "0.1.0"
description = "Production-oriented sales forecasting system"
authors = [
    { name = "Steffen Lauterbach" },
]
requires-python = ">=3.12.9,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "fsspec==2026.2.0",
    "gcsfs==2026.2.0",
    "httpx2>=2.12.0",
    "mlflow==3.15.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pandera==0.29.0",
    "plotly==6.3.0",
    "prefect>=3,<4",
    "prometheus-client==0.23.1",
    "pyarrow==25.0.1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
    "scikit-learn==1.8.0",
    "scipy==1.18.1",
    "streamlit==1.50.0",
    "uvicorn==0.40.0",
    "xgboost==3.1.3",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest>=9.0.3,<10",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_sales_forecasting"]
