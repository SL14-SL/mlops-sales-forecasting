global:
  resolve_timeout: 5m

route:
  receiver: local-alerts
  group_by:
    - alertname
    - service
    - severity
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-alerts

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service