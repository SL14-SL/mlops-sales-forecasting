global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/serving_readiness.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: mlops-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: api