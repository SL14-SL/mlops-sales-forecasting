name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Audit Python dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize dependencies
        run: uv sync --locked
      
      # MLflow 3.15.1 requires cryptography<50.
      # Remove PYSEC-2026-3552 when MLflow supports cryptography>=50.
      # Remove PYSEC-2026-3865 when a patched MLflow release is available.
      - name: Audit Python dependencies
        run: |
          for attempt in 1 2 3; do
            if uv run pip-audit \
              --ignore-vuln PYSEC-2026-3552 \
              --ignore-vuln PYSEC-2026-3865; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pip-audit failed; retrying..."
            sleep $((attempt * 10))
          done

  repository-scan:
    name: Scan repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

  container-image:
    name: Scan container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build API image
        run: >-
          docker build
          --tag "mlops-api-security-scan:${{ github.sha }}"
          .

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "mlops-api-security-scan:${{ github.sha }}"
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"