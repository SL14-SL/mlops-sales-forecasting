name: AWS model lifecycle
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        default: dev
      operation:
        type: choice
        options: [train, auto-retrain, rollback-model, refresh, simulate]
        default: train
      estimators:
        description: Optional tree count for a smoke test; empty uses project configuration
        type: string
        default: ''
      simulation_days:
        description: Simulation days, between 1 and 95
        type: string
        default: '95'
      simulation_mode:
        description: Compare static and managed runs from one initial baseline
        type: choice
        options: [both, managed, static]
        default: both
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false
jobs:
  lifecycle:
    if: github.event_name == 'workflow_dispatch' || vars.AWS_RETRAINING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-context
        with:
          role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          state_bucket: ${{ vars.AWS_TF_STATE_BUCKET }}
          environment: ${{ inputs.environment || 'dev' }}
      - name: Run lifecycle and wait for its exit code
        env:
          OPERATION: ${{ inputs.operation || 'auto-retrain' }}
          ESTIMATORS: ${{ inputs.estimators || '' }}
          SIMULATION_DAYS: ${{ inputs.simulation_days || '95' }}
          SIMULATION_MODE: ${{ inputs.simulation_mode || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=("$OPERATION")
          if [ -n "$ESTIMATORS" ]; then arguments+=(--estimators "$ESTIMATORS"); fi
          if [ "$OPERATION" = simulate ]; then
            arguments+=(--maximum-days "$SIMULATION_DAYS" --simulation-mode "$SIMULATION_MODE")
          fi
          python scripts/run_aws_task.py "${arguments[@]}"
