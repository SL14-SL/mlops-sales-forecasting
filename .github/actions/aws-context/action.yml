name: AWS deployment context
description: Authenticate through OIDC and initialize isolated remote Terraform state
inputs:
  role_arn:
    required: true
    description: GitHub OIDC deployment role
  region:
    required: true
    description: AWS region
  state_bucket:
    required: true
    description: Existing versioned state bucket
  environment:
    required: true
    description: Project environment
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
    - shell: bash
      env:
        STATE_BUCKET: ${{ inputs.state_bucket }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        STATE_REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        test -n "$STATE_BUCKET"
        terraform -chdir=infrastructure/terraform-aws init -input=false \
          -backend-config="bucket=$STATE_BUCKET" \
          -backend-config="key=${GITHUB_REPOSITORY}/${DEPLOY_ENVIRONMENT}/terraform.tfstate" \
          -backend-config="region=$STATE_REGION" \
          -backend-config=encrypt=true -backend-config=use_lockfile=true
